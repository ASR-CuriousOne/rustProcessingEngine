[package]
name = "rust_processing_engine"
version = "0.1.0"
edition = "2024"

default-run = "rust_processing_engine"

[[bin]]
name = "benchMmap"
path = "src/benchmarks/benchMmap.rs"

[[bin]]
name = "generate_csv"
path = "src/scripts/fake_data.rs"

[dependencies]
csv = "1.4.0"
serde = {version = "1.0.229", features = ["derive"]}
memmap2 = "0.9"
memchr = "2.8.3"
mimalloc = "0.1"
indicatif = "0.18.6"
fast-float = "0.2.0"

[features]
default = ["fast-csv"]
fast-csv = []

[profile.release]
debug = true
