[package]
name = "rust_processing_engine"
version = "0.1.0"
edition = "2024"

default-run = "rust_processing_engine"

[[bin]]
name = "benchSerial"
path = "src/benchmarks/benchmarkSerial.rs"

[[bin]]
name = "benchParallelCallback"
path = "src/benchmarks/benchmarkParallelCallback.rs"

[[bin]]
name = "benchParallelParsing"
path = "src/benchmarks/benchmarkParallelParsing.rs"

[dependencies]
csv = "1.4.0"
serde = {version = "1.0.229", features = ["derive"]}


